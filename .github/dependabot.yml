# HB-071 E (22 Nov 2026 update 22b, section 16; widened in the 23 Nov v4 update, section 6): every action in this
# repository's workflows is pinned to a full commit SHA with its version in a comment, and Dependabot proposes the
# new SHA when an action releases. bee-self-test's scripts/live_gate.py lint fails a workflow that uses a tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A new major (checkout 4 to 7, on 26 Nov 2026) can change an action's runtime or inputs: it is the dev's call,
    # made by hand. Dependabot proposes the minor and patch SHAs of the majors pinned here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
