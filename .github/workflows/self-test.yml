# Runs one HivemindOS agent tool's self-test and records the result (Based Elnen, 2026-10-29: "A tool cannot be marked
# Finished until its self-test has been run and passed"). The agents service sends a repository_dispatch
# {"repo": "<agent repository>", "tool": "<tool folder>"} after a build step commits; this checks out
# tools/<tool>/ from that repository's main branch, runs its self_test.py, self_test.mjs or self_test.sh with no
# token, and commits results/<repo>/<tool>.json, which the agents service reads back.
#
# The tool's code is untrusted: the job that runs it has no permissions and no token, and the result comes from the
# runner's own job result, not from anything the tool prints. Only the record job can write, and it runs no tool code.
#
# B-08r1 (25 Nov 2026 checklist; the 15 Nov self-watchdog pack, S11): before any tool code, the commit-time gates read
# the commit with git (scripts/commit_gates.py; pyflakes parses, nothing is run). D1, a path the tool's self_test.py or
# a CSV in its folder names that is not in the commit, refuses the run: the record is a failure whose tail says
# "missing in commit: <path>". D5 (an undefined name in any .py under the folder) and D22 (a file a work note or commit
# message of the last 48 h says it built, never committed) are recorded in the result's `gates` field, never a refusal.
# A gate that could not read the commit records {"v": 1, "error": ...} and never fails the tool.
name: self-test
on:
  repository_dispatch:
    types: [self-test]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    env:
      REPO: ${{ github.event.client_payload.repo }}
      TOOL: ${{ github.event.client_payload.tool }}
    outputs:
      kind: ${{ steps.find.outputs.kind }}
      sha: ${{ steps.find.outputs.sha }}
      tree: ${{ steps.find.outputs.tree }}
      check: ${{ steps.find.outputs.check }}
      tail: ${{ steps.tail.outputs.tail }}
      gates: ${{ steps.gates.outputs.gates }}
    steps:
      - id: find
        name: Fetch the tool
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || { echo "Not a repository name."; exit 2; }
          [[ "$TOOL" =~ ^[a-z0-9][a-z0-9-]{1,47}$ ]] || { echo "Not a tool name."; exit 2; }
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git" work
          git -C work sparse-checkout set "tools/${TOOL}"
          echo "sha=$(git -C work rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The tool folder's git tree hash: what this run tested. The agents service tells a changed tool from a re-run
          # of the same files by it, so a repair parked on two same-cause failures waits for new files (BS22, 2026-11-16).
          echo "tree=$(git -C work rev-parse "HEAD:tools/${TOOL}" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          for name in self_test.py self_test.mjs self_test.sh; do
            if [ -f "work/tools/${TOOL}/${name}" ]; then
              echo "kind=${name}" >> "$GITHUB_OUTPUT"
              # The check that judges this run, by its sha256 (HB-061's ask of HB-058, 20 Nov 2026): a reader tells a run
              # judged by an edited self-test from one judged by the same file as the run before.
              echo "check=$(sha256sum "work/tools/${TOOL}/${name}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "kind=none" >> "$GITHUB_OUTPUT"
      - id: gates
        name: Commit-time gates, before any tool code (B-08r1; D1 refuses, D5 and D22 are recorded)
        if: steps.find.outputs.kind != 'none'
        timeout-minutes: 3
        env:
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          set -u
          code=2
          if git clone --quiet --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" runner \
              && git -C runner checkout --quiet "$GITHUB_SHA" \
              && python3 -m pip install --quiet pyflakes==3.2.0 \
              && git clone --quiet --filter=blob:none --no-checkout "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git" history; then
            code=0
            python3 runner/scripts/commit_gates.py history --commit "$SHA" --tool "$TOOL" --pregate --json "$RUNNER_TEMP/gates.json" > "$RUNNER_TEMP/gates.txt" 2>&1 || code=$?
            cat "$RUNNER_TEMP/gates.txt" | tee -a "$RUNNER_TEMP/out.txt"
          fi
          python3 - "$code" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          code = int(sys.argv[1])
          try:
              g = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "gates.json")))
              out = {"v": 1, "commit": g["commit"], "refused": code == 1, "d1": g["d1"][:20], "d5": g["d5"][:20], "d22": g["d22"][:20]}
          except Exception as error:
              out = {"v": 1, "error": f"the gates could not read the commit (exit {code}, {type(error).__name__})"}
          print("gates=" + json.dumps(out, separators=(",", ":"))[:6000])
          PY
          # Only a D1 refusal fails the run; a gate that could not read the commit never counts against the tool.
          if [ "$code" = "1" ]; then exit 1; fi
      - name: Compile its Python
        # Every .py in the folder is byte-compiled before the self-test runs (Based Elnen, 2026-11-12/13, living spec
        # L52): a SyntaxError fails the run at once, and its line is kept in the record, never a "finished" tool.
        if: steps.find.outputs.kind != 'none'
        timeout-minutes: 1
        run: |
          set -o pipefail
          cd "work/tools/${TOOL}"
          find . -name '*.py' -not -path '*/.*' -print0 | xargs -0 -r -n1 python3 -m py_compile 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - name: Run its self-test
        if: steps.find.outputs.kind != 'none'
        timeout-minutes: 4
        env:
          KIND: ${{ steps.find.outputs.kind }}
        run: |
          set -o pipefail
          cd "work/tools/${TOOL}"
          case "$KIND" in
            self_test.py) python3 self_test.py ;;
            self_test.mjs) node self_test.mjs ;;
            self_test.sh) bash self_test.sh ;;
            *) exit 2 ;;
          esac 2>&1 | tee -a "$RUNNER_TEMP/out.txt"
      - id: tail
        name: Keep what failed and the last lines it printed
        if: always()
        # Up to four lines saying what failed, then the last eight: a FAIL printed before the last eight was lost
        # (hivepunk-1071's update-index, run 41756203126: three FAIL lines, eight "ok" lines kept). The agents service
        # reads failed lines first (core/bee-build-files.ts readBeeSelfTestRecord).
        run: |
          {
            echo 'tail<<HIVE_SELF_TEST_END'
            {
              lines=$(wc -l 2>/dev/null < "$RUNNER_TEMP/out.txt" || echo 0)
              head -n "$(( lines > 8 ? lines - 8 : 0 ))" "$RUNNER_TEMP/out.txt" 2>/dev/null | grep -E '\bFAIL(ED|URE)?\b|[A-Za-z]*(Error|Exception)\b|^Traceback\b' | head -n 4 || true
              tail -n 8 "$RUNNER_TEMP/out.txt" 2>/dev/null || true
            } | cut -c1-200 | grep -v '^HIVE_SELF_TEST_END$' || true
            echo 'HIVE_SELF_TEST_END'
          } >> "$GITHUB_OUTPUT"
  # HB-061 (20 Nov 2026 update, Part 6): the check that judges a change comes from the base. The agents service names
  # the tool's last passing commit as `base`. When a check file (self_test.*, fixtures/, expected*) differs between that
  # commit and now, the base check is run on the new code, and, if that fails, the edited check on the base code. Each
  # mixed tree runs in its own job with no token, so nothing the tool's code does in one run can change another run's
  # result, and each verdict is the job's result as GitHub reports it. Observe mode: the record's `result` is still the
  # test job's alone; `verified_by` only says which check decided (scripts/base_check.py).
  basis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions: {}
    env:
      REPO: ${{ github.event.client_payload.repo }}
      TOOL: ${{ github.event.client_payload.tool }}
      BASE: ${{ github.event.client_payload.base }}
    outputs:
      base: ${{ steps.plan.outputs.base }}
      plan: ${{ steps.plan.outputs.plan }}
      edited: ${{ steps.plan.outputs.edited }}
    steps:
      - id: plan
        name: Compare its check files with its last passing run's (no tool code is run)
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || { echo "Not a repository name."; exit 2; }
          [[ "$TOOL" =~ ^[a-z0-9][a-z0-9-]{1,47}$ ]] || { echo "Not a tool name."; exit 2; }
          if ! [[ "${BASE:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No base commit named: a first check, or a service that does not name one yet."
            { echo "base="; echo "plan="; echo "edited=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" runner
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git" work
          git -C work sparse-checkout set "tools/${TOOL}"
          git init --quiet base
          git -C base remote add origin "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git"
          git -C base sparse-checkout set "tools/${TOOL}"
          git -C base fetch --quiet --depth 1 --filter=blob:none origin "$BASE" && git -C base checkout --quiet FETCH_HEAD || echo "The base commit could not be fetched."
          plan=$(python3 runner/scripts/base_check.py plan "work/tools/${TOOL}" "base/tools/${TOOL}")
          echo "$plan"
          edited=$(python3 -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("check_edited") else "false")' "$plan")
          { echo "base=${BASE}"; echo "plan=${plan}"; echo "edited=${edited}"; } >> "$GITHUB_OUTPUT"
  base:
    needs: basis
    if: needs.basis.outputs.edited == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    env:
      REPO: ${{ github.event.client_payload.repo }}
      TOOL: ${{ github.event.client_payload.tool }}
      BASE: ${{ needs.basis.outputs.base }}
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - id: build
        name: Put the base check on the new code (no tool code is run yet)
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ && "$TOOL" =~ ^[a-z0-9][a-z0-9-]{1,47}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git clone --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" runner
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git" work
          git -C work sparse-checkout set "tools/${TOOL}"
          git init --quiet base
          git -C base remote add origin "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git"
          git -C base sparse-checkout set "tools/${TOOL}"
          git -C base fetch --quiet --depth 1 --filter=blob:none origin "$BASE"
          git -C base checkout --quiet FETCH_HEAD
          python3 runner/scripts/base_check.py build base-check-on-new "work/tools/${TOOL}" "base/tools/${TOOL}" mixed
          rm -rf runner work base
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Compile its Python
        timeout-minutes: 1
        run: |
          cd mixed
          find . -name '*.py' -not -path '*/.*' -print0 | xargs -0 -r -n1 python3 -m py_compile
      - name: Run the base check on the new code
        timeout-minutes: 4
        run: |
          cd mixed
          if [ -f self_test.py ]; then python3 self_test.py; elif [ -f self_test.mjs ]; then node self_test.mjs; elif [ -f self_test.sh ]; then bash self_test.sh; else echo "The base has no self-test file."; exit 2; fi
  newbase:
    needs: [basis, base]
    if: always() && needs.basis.outputs.edited == 'true' && needs.base.result == 'failure' && needs.base.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    env:
      REPO: ${{ github.event.client_payload.repo }}
      TOOL: ${{ github.event.client_payload.tool }}
      BASE: ${{ needs.basis.outputs.base }}
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - id: build
        name: Put the edited check on the base code (no tool code is run yet)
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ && "$TOOL" =~ ^[a-z0-9][a-z0-9-]{1,47}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git clone --quiet --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" runner
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git" work
          git -C work sparse-checkout set "tools/${TOOL}"
          git init --quiet base
          git -C base remote add origin "https://github.com/${GITHUB_REPOSITORY_OWNER}/${REPO}.git"
          git -C base sparse-checkout set "tools/${TOOL}"
          git -C base fetch --quiet --depth 1 --filter=blob:none origin "$BASE"
          git -C base checkout --quiet FETCH_HEAD
          python3 runner/scripts/base_check.py build new-check-on-base "work/tools/${TOOL}" "base/tools/${TOOL}" mixed
          rm -rf runner work base
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Compile its Python
        timeout-minutes: 1
        run: |
          cd mixed
          find . -name '*.py' -not -path '*/.*' -print0 | xargs -0 -r -n1 python3 -m py_compile
      - name: Run the edited check on the base code
        timeout-minutes: 4
        run: |
          cd mixed
          if [ -f self_test.py ]; then python3 self_test.py; elif [ -f self_test.mjs ]; then node self_test.mjs; elif [ -f self_test.sh ]; then bash self_test.sh; else echo "The change has no self-test file."; exit 2; fi
  record:
    needs: [test, basis, base, newbase]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record the result
        env:
          REPO: ${{ github.event.client_payload.repo }}
          TOOL: ${{ github.event.client_payload.tool }}
          RESULT: ${{ needs.test.result }}
          KIND: ${{ needs.test.outputs.kind }}
          SHA: ${{ needs.test.outputs.sha }}
          TREE: ${{ needs.test.outputs.tree }}
          CHECK: ${{ needs.test.outputs.check }}
          TAIL: ${{ needs.test.outputs.tail }}
          GATES: ${{ needs.test.outputs.gates }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # HB-061: what the three base jobs observed. A mixed run counts only when its tree was built.
          BASE: ${{ needs.basis.outputs.base }}
          PLAN: ${{ needs.basis.outputs.plan }}
          BASE_JOB: ${{ needs.base.outputs.built == 'true' && needs.base.result || (needs.base.result == 'skipped' && 'skipped' || 'not-built') }}
          NEWBASE_JOB: ${{ needs.newbase.outputs.built == 'true' && needs.newbase.result || (needs.newbase.result == 'skipped' && 'skipped' || 'not-built') }}
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ && "$TOOL" =~ ^[a-z0-9][a-z0-9-]{1,47}$ ]] || exit 0
          mkdir -p "results/${REPO}"
          python3 - <<'PY'
          import json, os, datetime
          result = "none" if os.environ["KIND"] == "none" else os.environ["RESULT"]
          record = {"repo": os.environ["REPO"], "tool": os.environ["TOOL"], "result": result, "file": os.environ["KIND"] or None,
                    "sha": os.environ["SHA"] or None, "tree": os.environ.get("TREE") or None, "check_sha256": os.environ.get("CHECK") or None, "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                    "run": os.environ["RUN"], "tail": os.environ["TAIL"][:2600]}
          # B-08r1: the commit-time gates (D1, D5, D22), when they ran.
          try:
              gates = json.loads(os.environ.get("GATES") or "null")
              if isinstance(gates, dict):
                  record["gates"] = gates
          except ValueError:
              record["gates"] = {"v": 1, "error": "the gates' output did not parse"}
          # HB-061: how it was verified, and which check decided. Never a reason to lose the record itself.
          try:
              import sys
              sys.path.insert(0, "scripts")
              from base_check import stamp
              plan = json.loads(os.environ.get("PLAN") or "null")
              record["verified_by"] = stamp({"result": result, "run": record["run"], "tested_sha": record["sha"], "check_sha256": record["check_sha256"],
                                             "base_sha": os.environ.get("BASE") or "", "plan": plan,
                                             "base_job": os.environ.get("BASE_JOB") or "", "newbase_job": os.environ.get("NEWBASE_JOB") or ""})
          except Exception as error:
              record["verified_by"] = {"kind": "runner" if result == "success" else "none", "check_from": "none", "reasons": [f"the stamp could not be worked out: {type(error).__name__}"]}
          with open(f"results/{record['repo']}/{record['tool']}.json", "w") as out:
              json.dump(record, out, indent=2)
              out.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          # The title says what was recorded: a run that found no self-test is "none", never "success" (living spec L14).
          SHOWN="$RESULT"; [ "$KIND" = "none" ] && SHOWN="none"
          git commit --quiet -m "${REPO} ${TOOL}: ${SHOWN}" || exit 0
          for try in 1 2 3 4 5 6; do
            git push --quiet && exit 0
            sleep $((try * 2))
            git pull --quiet --rebase
          done
          exit 1
