# Row 13 of the 24 Nov 2026 dev update (section 32.1): one chain config, scripts/chains.py, and GitChecker's Base-only
# blockers in this repository's readers. Required on every push that changes code here:
#   scripts/chain_literals.py   guard 53: no configured chain id (decimal, inside eip155:, or 0x hex) and no RPC or
#                               explorer host in any code file outside scripts/chains.py; its fixtures are today's lines
#   tests/test_chains.py        guards 54 (source_match.py reads a Robinhood Chain coin on its chain; an unknown chain is UNABLE),
#                               55 (Claim Watch's ERC-8004 match is per chain; a Robinhood Chain agent with no registry in the
#                               config is NOT_CHECKABLE, never NOT_REGISTERED), 56 (lift_run.py refuses unless the task
#                               set and eth_chainId are the requested chain) and 78 (the Lab's x402 reader takes USDG on
#                               Robinhood Chain's CAIP-2 id or v1 robinhood; USDC there, or an unknown network, is NOT_CHECKABLE), and
#                               the config's chain words against the host's (fixtures/chain-config/host-words.json)
# No network, no token and nothing written. host-checks runs the same lint and tests every day.
name: chain-config (manual-only)
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/**", "fixtures/chain-literals/**", "fixtures/chain-config/**", "link_registry.json"]
  workflow_dispatch:
permissions: {}
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Guard 53, no bare chain literal outside scripts/chains.py
        run: |
          set -eu
          python3 scripts/chain_literals.py --self-test
          python3 scripts/chain_literals.py
      - name: Guards 54, 55, 56 and 78
        run: python3 -m unittest discover -s tests -p 'test_chains.py' -v
