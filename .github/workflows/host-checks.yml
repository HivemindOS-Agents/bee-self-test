# The host's own rule checks, on their fixtures and then on the live public files:
#   scripts/opportunities_48h.py   HB-056's 48-hour check (20 Nov 2026 update, Part 2: an asked-for item that went on to
#                                  Building or Shipped inside the window counts)
#   scripts/opportunities_hb060.py HB-060 and HB-059: every in-lane ask sized or said why, one Hall owner, frozen pins,
#                                  and the host's link commits since its linker began to keep out of frozen files. 25 Nov
#                                  update rows 61, 84 and 85 (guards 188, 241, 242): Picked, Building and Shipped takes
#                                  count, a pickable item served by a take or matching a held or taken item on any agent
#                                  fails, a Spotted record stands in for a quoted ask, and the junk rule reads labels
#                                  (tests/test_opportunity_takes.py, with opp-547-430 / opp-1071-180 as fixtures)
#   scripts/health_hb062.py        HB-062: a topic-filter refusal is a policy skip and does not hold health
#   scripts/first_pass_replay.py   HB-058: a proof bundle's first-pass record worked out again from its listed steps
#   scripts/rule_map_check.py      HB-063: the rule map is valid and matches AUTONOMY.md, rule for rule
#   scripts/base_check.py          HB-061: which files are checks, the two mixed trees, and the verified_by stamp
#   scripts/source_match.py        HB-054 "+": a Sourcify "verified" label recomputed against the code on Base
#   scripts/lift_run.py            HB-036 "+": held-out tasks picked after a skill's edit, a calibrated proxy, and what a
#                                  promotion needs (tests/test_lift_run.py)
#   scripts/kept_rules.py          HB-061: a kept rule cites two runs and another agent's same answer, each a trace
#                                  item that is that request with that status; a rejected one cites the run that went
#                                  through; an honest-failure row has three rounds and the hash of its own JSON
#   scripts/rule_stops.py          HB-063: what followed each stop on a rule within 24 hours: a re-attempt, a note that
#                                  claims the stopped folder, or files committed under it
#   scripts/repair_receipts.py     HB-065: a repair that ended has a valid receipt in its agent's repository, never
#                                  edited; an escalation names its receiver within 24 hours; an open step repair's
#                                  counters follow LESSONS.md; every LESSONS failure names its one bucket. An
#                                  honest-failure row is kept_rules.py's, not a receipt (HB-067 D, one owner a file kind)
#   scripts/labels.py              22 Nov update, sections 3 and 4: "paused: needs funding" and "blocked: host limit",
#                                  recognised in one place; every reader above and below leaves both out of its failure
#                                  counts and repeat flags and says each on its own line per agent (its contract test
#                                  runs one of each through every reader)
#   scripts/repeat_guard.py        HB-067 B: a repeat is keyed on the play or tool and its normalised cause, not the
#                                  commit, in LESSONS.md, the runner's records and research receipts; the 3rd try on one
#                                  cause would be held. HB-068: a tool that failed 3 times on a missing file no commit
#                                  ever added is the host's limit (shadow)
#   scripts/rule_lifecycle.py      HB-067 A: every prose or partly rule and every check in shadow.json has a decide-by
#                                  date at most 14 days out, and an agent's preflight logs have not gone quiet (shadow)
#   scripts/done_paths.py          HB-067 G: a build step's note headed Done changed something under tools/ and names
#                                  only tools/ folders that exist (shadow)
#   scripts/link_registry.py       HB-067 C: every hivemindos.app link in the agents' repositories is a shape in
#                                  link_registry.json, and one sample a shape answers (shadow)
#   scripts/feed_freshness.py      25 Nov update row 102 (guard 263, replacing 24 Nov guard 26): a feed is current only
#                                  while its newest content timestamp (updatedAt, or an item's updatedAt or startedAt) is
#                                  at most 48 h old, never by generatedAt; a stale feed that catches up is diffed against
#                                  the 30-day backfill (tests/test_feed_freshness.py; the live read is report-level, and
#                                  its last state per feed is kept in the Actions cache between runs)
#   scripts/x402_encoded_paths.py  Guard 135 (24 Nov §45.7, 25 Nov row 41r3): unpaid requests with encoded path variants
#                                  (%2F, %2f, %5C, %5c, %252F) on every keyless paid x402 operation in openapi.json never
#                                  return 2xx (x402 #3850's class). tests/test_x402_encoded_paths.py is required; the live
#                                  read sends at most 36 unpaid requests a run (6 operations, new routes first, the
#                                  probed set kept in the Actions cache), and a 2xx or a STOP fails the run
#   scripts/check_strength.py      HB-067 E: how many of 20 small fixed-seed breaks of a tool's code its own self-test
#                                  catches; run in a job of its own with no token, on three of 547's tools (report-only)
#
# The fixtures are the required part: this run fails when a script stops catching its own regression cases, and
# tests/test_security_inputs.py runs every security reader on empty, comma-only, unparseable and absent inputs (HB-136,
# HB-137, HB-138). Row 41r2: every security key a reader takes with field() has an empty-state fixture in that file's
# EMPTY_STATE (security_input.py --keys). Row 41r4: scripts/security_input.py is the same bytes as bee-scouts' copy at
# its main (security_input.py --same-as). The live reads are report-only: they say where the agents stand today, and never fail the run, with
# three exceptions (HB-140). A Sourcify label that the code on Base does not back, on a contract HivemindOS names or a
# coin its market calls verified, fails the run (a contract that is unlisted or could not be recomputed does not). The
# rule map check fails the run on any mismatch or STOP. The repair receipt check fails the run on a STOP (an empty,
# unparseable or absent receipt, health or watchdog file, exit 2, or an agent that could not be cloned); its problems
# stay report-only until HB-065's decide-by date in shadow.json. Those two record what failed in stops.txt and the last
# step fails the run, so every later live read still says where the agents stand. Everything is read from
# public files and public endpoints with no token; nothing in an agent repository is run, and this job writes nothing.
# The one exception is check_strength, which runs three of agent 547's own self-tests: it runs them in a job of its
# own, with no permissions and no token, each inside a temp copy of the tool's folder.
name: host-checks
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"
  push:
    branches: [main]
    paths: ["scripts/security_input.py", "scripts/claim_watch.py", "scripts/check_skill_files.py", "tests/test_security_inputs.py", "fixtures/rule-map/**", "fixtures/claim-watch/**", "fixtures/skill-files/**", "scripts/opportunities_48h.py", "scripts/opportunities_hb060.py", "scripts/opportunity_records.py", "tests/test_opportunity_takes.py", "tests/test_opportunities_48h.py", "fixtures/opportunities/**", "scripts/health_hb062.py", "scripts/first_pass_replay.py", "scripts/rule_map_check.py", "scripts/base_check.py", "scripts/source_match.py", "scripts/repair_receipts.py", "scripts/rule_stops.py", "scripts/kept_rules.py", "scripts/labels.py", "scripts/git_history.py", "scripts/repeat_guard.py", "scripts/rule_lifecycle.py", "scripts/done_paths.py", "scripts/link_registry.py", "scripts/check_strength.py", "scripts/compile_sweep.py", "scripts/workflow_age.py", "scripts/feed_freshness.py", "tests/test_feed_freshness.py", "fixtures/feed-freshness/**", "scripts/x402_encoded_paths.py", "tests/test_x402_encoded_paths.py", "fixtures/x402-encoded-paths/**", "shadow.json", "link_registry.json", "fixtures/repair-receipts/**", "fixtures/repeat-guard/**", "fixtures/done-paths/**", "fixtures/link-registry/**", "fixtures/check-strength/**", "fixtures/source-match/**", "scripts/lift_run.py", "tests/test_lift_run.py", "lift/**/held-out.json", "lift/**/tasks.json", ".github/workflows/host-checks.yml"]
permissions: {}
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Fixtures (required)
        run: |
          set -eu
          python3 scripts/security_input.py --self-test
          python3 scripts/security_input.py --keys scripts tests/test_security_inputs.py
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/bee-scouts.git" "$RUNNER_TEMP/bee-scouts-copy"
          git -C "$RUNNER_TEMP/bee-scouts-copy" sparse-checkout set scripts
          python3 scripts/security_input.py --same-as "$RUNNER_TEMP/bee-scouts-copy/scripts/security_input.py"
          python3 -m unittest discover -s tests -p 'test_security_inputs.py'
          python3 scripts/opportunities_48h.py --self-test
          python3 -m unittest discover -s tests -p 'test_opportunities_48h.py'
          python3 scripts/opportunities_hb060.py --self-test
          python3 -m unittest discover -s tests -p 'test_opportunity_takes.py'
          python3 scripts/health_hb062.py --self-test
          python3 scripts/first_pass_replay.py --self-test
          python3 scripts/rule_map_check.py --self-test
          python3 scripts/base_check.py --self-test
          python3 scripts/source_match.py --self-test
          python3 scripts/repair_receipts.py --self-test
          python3 scripts/rule_stops.py --self-test
          python3 scripts/kept_rules.py --self-test
          python3 scripts/labels.py --self-test
          python3 scripts/repeat_guard.py --self-test
          python3 scripts/rule_lifecycle.py --self-test
          python3 scripts/done_paths.py --self-test
          python3 scripts/link_registry.py --self-test
          python3 scripts/check_strength.py --self-test
          python3 scripts/compile_sweep.py --self-test
          python3 scripts/workflow_age.py --self-test
          python3 -m unittest discover -s tests -p 'test_feed_freshness.py'
          python3 -m unittest discover -s tests -p 'test_x402_encoded_paths.py'
          python3 -m unittest discover -s tests -p 'test_lift_run.py'
      - name: Live, the 48-hour check (report-only)
        run: |
          python3 scripts/opportunities_48h.py || echo "report-only, exit $?"
      - name: Live, HB-060 and HB-059 (report-only)
        run: |
          python3 scripts/opportunities_hb060.py || echo "report-only, exit $?"
      - name: Live, HB-059 the linker's skip, from each agent repository's history (report-only)
        run: |
          mkdir -p "$RUNNER_TEMP/history"
          for n in 547 632 667 1071 86; do
            git clone --quiet --filter=blob:none --no-checkout --shallow-since=2026-11-17 "https://github.com/${GITHUB_REPOSITORY_OWNER}/hivepunk-${n}.git" "$RUNNER_TEMP/history/hivepunk-${n}" || echo "could not read hivepunk-${n}"
          done
          python3 scripts/opportunities_hb060.py --linker "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-063 what followed each stop on a rule, from each agent repository's history (report-only)
        run: |
          python3 scripts/rule_stops.py "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-061 the stamps on the kept runner records, and how many would block (observe mode, report-only)
        run: |
          python3 scripts/base_check.py stamps results || echo "report-only, exit $?"
      - name: Live, HB-062 health (report-only)
        run: |
          python3 scripts/health_hb062.py || echo "report-only, exit $?"
      - name: Live, HB-058 first-pass replay on the five agents' proof bundles (report-only)
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          for n in 547 632 667 1071 86; do
            git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/hivepunk-${n}.git" "$RUNNER_TEMP/repos/hivepunk-${n}" \
              && git -C "$RUNNER_TEMP/repos/hivepunk-${n}" sparse-checkout set proofs || echo "could not read hivepunk-${n}"
          done
          python3 scripts/first_pass_replay.py "$RUNNER_TEMP"/repos/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-065 repair receipts, escalation receivers and where failures went (a STOP fails the run; problems report-only until 2026-11-28)
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          for n in 547 632 667 1071 86; do
            git clone --quiet --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/hivepunk-${n}.git" "$RUNNER_TEMP/receipts/hivepunk-${n}" \
              && git -C "$RUNNER_TEMP/receipts/hivepunk-${n}" sparse-checkout set repairs watchdog \
              || echo "HB-065 repair receipts: STOP empty_security_setting: hivepunk-${n} could not be cloned" | tee -a "$RUNNER_TEMP/stops.txt"
          done
          code=0
          python3 scripts/repair_receipts.py "$RUNNER_TEMP"/receipts/hivepunk-* || code=$?
          if [ "$code" = "2" ]; then echo "HB-065 repair receipts: a file stopped the run (exit 2, STOP lines above)" >> "$RUNNER_TEMP/stops.txt"; fi
          echo "exit $code (2 fails the run at its last step; 1 is report-only until HB-065's decide-by date, 2026-11-28 in shadow.json)"
      - name: Live, HB-061 kept rules against the judgement files they cite, and honest-failure rows (report-only)
        run: |
          python3 scripts/kept_rules.py "$RUNNER_TEMP"/receipts/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-063 rule map against AUTONOMY.md both ways, and the five agents' copies (fails the run at its last step)
        run: |
          python3 scripts/rule_map_check.py --agents 547 632 667 1071 86 || echo "HB-063 rule map: exit $? (1 a mismatch, 2 a STOP)" | tee -a "$RUNNER_TEMP/stops.txt"
      - name: Live, HB-067 B and HB-068 repeats keyed on their cause, and writes that never landed, from each agent repository's whole history (shadow, report-only)
        run: |
          for d in "$RUNNER_TEMP"/history/hivepunk-*; do
            git -C "$d" fetch --quiet --unshallow --filter=blob:none origin || echo "could not read all of $d's history"
          done
          python3 scripts/repeat_guard.py --since 2026-11-14 "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-074 every scheduled workflow ran within its period plus a grace (report-only until its decide-by date)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/workflow_age.py "$GITHUB_REPOSITORY" .github/workflows || echo "report-only, exit $?"
      - name: Live, L52 every Python file under tools/ compiles, frozen tools included (report-only until its decide-by date)
        run: |
          python3 scripts/compile_sweep.py "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-067 G Done build notes against what their step committed (shadow, report-only)
        run: |
          python3 scripts/done_paths.py --since 2026-11-14 "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-067 A every prose rule and shadow check has a decide-by date, and preflight logs go on (shadow, report-only)
        run: |
          python3 scripts/rule_lifecycle.py "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-067 C every hivemindos.app link is a registered shape that answers (shadow, report-only)
        run: |
          python3 scripts/link_registry.py "$RUNNER_TEMP"/history/hivepunk-* || echo "report-only, exit $?"
      - name: Live, HB-036 plus, what each recorded lift run lacks, and the held-out tasks picked again (report-only)
        run: |
          python3 scripts/lift_run.py --audit lift/*/runs/*.json || echo "report-only, exit $?"
          for held in lift/*/held-out.json; do
            [ -f "$held" ] || continue
            python3 scripts/lift_run.py --verify-held-out "$held" --taskset "$(dirname "$held")/tasks.json" || echo "report-only, exit $?"
          done
      - name: Live, HB-054 plus, Sourcify labels recomputed against Base (a label the code does not back fails the run)
        run: |
          code=0
          python3 scripts/source_match.py || code=$?
          if [ "$code" = "2" ]; then echo "a Sourcify label is not backed by the code on Base"; exit 1; fi
          echo "exit $code (1 is report-only, something unlisted or not recomputable)"
      - name: Restore each feed's last freshness state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/feed-state.json
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      - name: Live, row 102 feed freshness by newest content time, and a caught-up feed's 30-day backfill diff (report-level)
        run: |
          python3 scripts/feed_freshness.py --state "$RUNNER_TEMP/feed-state.json" https://pwn.watch/incidents.json https://pwn.watch/t/ai.json || echo "report-level, exit $?"
      - name: Keep each feed's freshness state for the next run
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/feed-state.json
          key: feed-state-${{ github.run_id }}
      - name: Restore which paid x402 operations were probed before
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/x402-probed.json
          key: x402-probed-${{ github.run_id }}
          restore-keys: x402-probed-
      - name: Live, guard 135 encoded paths on keyless paid x402 operations, unpaid (a 2xx or a STOP fails the run at its last step)
        run: |
          code=0
          python3 scripts/x402_encoded_paths.py --state "$RUNNER_TEMP/x402-probed.json" || code=$?
          if [ "$code" = "2" ]; then echo "guard 135: a paid x402 route answered 2xx unpaid, or openapi.json stopped the run (exit 2)" | tee -a "$RUNNER_TEMP/stops.txt"; fi
          echo "exit $code (1 is report-only: a request could not be read)"
      - name: Keep which paid x402 operations were probed
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/x402-probed.json
          key: x402-probed-${{ github.run_id }}
      - name: The security steps above that stopped or did not match fail the run (HB-140)
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/stops.txt" ]; then cat "$RUNNER_TEMP/stops.txt"; exit 1; fi
          echo "the rule map matched, and no receipt, health or watchdog file stopped the run"
  check-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Live, HB-067 E how many small breaks three of 547's tools' self-tests catch (no token, report-only)
        run: |
          git clone --quiet --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" checks && git -C checks checkout --quiet "$GITHUB_SHA"
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/hivepunk-547.git" "$RUNNER_TEMP/hivepunk-547" \
            && git -C "$RUNNER_TEMP/hivepunk-547" sparse-checkout set tools/dataset-manifest-check tools/hf-publish-check tools/csv-schema-check || echo "could not read hivepunk-547"
          python3 checks/scripts/check_strength.py "$RUNNER_TEMP"/hivepunk-547/tools/dataset-manifest-check "$RUNNER_TEMP"/hivepunk-547/tools/hf-publish-check "$RUNNER_TEMP"/hivepunk-547/tools/csv-schema-check || echo "report-only, exit $?"
