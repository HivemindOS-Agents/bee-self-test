# HB-054 Agent Claim Watch: the day file anyone can recompute, replayed from the outside every day.
#
# The agents service writes bee-scouts/watch/<date>.jsonl once a day: what each of HivemindOS's pinned skills claims
# against what is there, as canonical JSON lines, and watch/index.json with each day's sha256. This job holds the same
# checks (scripts/claim_watch.py), runs their fixtures, and replays the newest day file: that the file is the bytes its
# sha256 names, that no line says more of a finding than its number, that no sensitive outcome is public, and that each
# row's target still gives that outcome (MATCH, CHANGED, GONE or UNABLE). Records are read again from Base, the day's
# registry sample is picked again from its seed, HivemindOS's own paid endpoints are asked again with no payment, and
# each pinned skill's packages are looked up again; the Bazaar's sample is not picked again (its pages move).
#
# The fixtures are required. A STOP fails the run (HB-136, HB-140): an index or day file that is absent, empty or does
# not parse, a day file that is not the bytes its sha256 names or says a finding or a sensitive outcome in public (exit
# 2), and the coverage check on the newest day. The replay's other verdicts are report-only: a source that moved since
# the file was written is CHANGED, and the Bazaar's sample is UNABLE every day by design; that is the world, not a
# fault. Everything is read from public files with no token; nothing in any repository is run, and this job writes
# nothing.
name: claim-watch
on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"
  push:
    branches: [main]
    paths: ["scripts/claim_watch.py", "scripts/security_input.py", "tests/test_security_inputs.py", "fixtures/claim-watch/**", ".github/workflows/claim-watch.yml"]
permissions: {}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixtures (required)
        run: |
          set -eu
          python3 scripts/claim_watch.py --self-test
          python3 scripts/security_input.py --self-test
          python3 -m unittest discover -s tests -p 'test_security_inputs.py' -k ClaimWatch
      - name: Replay the newest day file (a STOP and the coverage check fail the run; other verdicts report-only)
        env:
          # Only for the advisory family's queries to GitHub's public advisories (its rate limit). It writes nothing.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/bee-scouts/main/watch"
          # Day files are published every day since 21 Nov 2026: an index or day file that cannot be read is a STOP.
          if ! curl -fsS "$base/index.json" -o "$RUNNER_TEMP/index.json"; then echo "STOP empty_security_setting: watch/index.json: absent: could not be read"; exit 2; fi
          newest=$(python3 scripts/claim_watch.py --newest "$RUNNER_TEMP/index.json") || exit 2
          set -- $newest
          echo "newest day file: $1, sha256 $2"
          if ! curl -fsS "$base/$1.jsonl" -o "$RUNNER_TEMP/$1.jsonl"; then echo "STOP empty_security_setting: watch/$1.jsonl: absent: could not be read"; exit 2; fi
          code=0
          python3 scripts/claim_watch.py --replay "$RUNNER_TEMP/$1.jsonl" "$2" || code=$?
          if [ "$code" = "2" ]; then exit 2; fi
          echo "replay exit $code (1 is report-only: CHANGED, GONE or UNABLE is the world moving, not a fault)"
          python3 scripts/claim_watch.py --coverage "$RUNNER_TEMP/$1.jsonl" || exit $?
