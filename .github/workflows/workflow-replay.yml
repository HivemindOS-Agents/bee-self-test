# Re-runs one agent workflow's replay as a peer and records what came of it (B-27, S17 of the 24 Nov 2026 dev update).
# The agents service sends a repository_dispatch for a peer agent of a different owner:
# {"repo": "<builder's repository>", "slug": "<workflow slug>", "digest": "<16 hex>", "peer": "<peer agent>",
#  "peer_owner": "<its owner>"}. scripts/workflow_replay.py reads workflows/<slug>/replay/<digest>.json from that
# repository's main branch, rebuilds each input from public sources (the tool folder, its README card, this
# repository's runner verdict) and runs the workflow's replay checks on it. The record job commits
# rescores/<repo>/wf-<slug>-<digest>.json: REPRODUCED, DIFFERENT or UNABLE, with who asked. The agents service serves the
# workflow only on a REPRODUCED from a peer that does not share the builder's owner (core agentWorkflowServable).
#
# No agent code runs here: the replay reads files and runs fixed checks. The read job still has no permissions and no
# token; only the record job writes. The fixtures run first on every dispatch, and alone on a change to the script.
name: workflow-replay
on:
  repository_dispatch:
    types: [workflow-replay]
  push:
    branches: [main]
    paths: ["scripts/workflow_replay.py", "fixtures/workflow-replay/**", ".github/workflows/workflow-replay.yml"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {}
    env:
      REPO: ${{ github.event.client_payload.repo }}
      SLUG: ${{ github.event.client_payload.slug }}
      DIGEST: ${{ github.event.client_payload.digest }}
    outputs:
      result: ${{ steps.replay.outputs.result }}
      observed: ${{ steps.replay.outputs.observed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The fixtures
        run: python3 scripts/workflow_replay.py --fixtures fixtures/workflow-replay
      - id: replay
        name: Re-run the replay
        if: github.event_name == 'repository_dispatch'
        run: |
          set -u
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || { echo "Not a repository name."; exit 2; }
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]{1,60}$ && "$DIGEST" =~ ^[0-9a-f]{16}$ ]] || { echo "Not a workflow slug and digest."; exit 2; }
          python3 scripts/workflow_replay.py "https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/${REPO}/main/workflows/${SLUG}/replay/${DIGEST}.json" --repo "$REPO" --json "$RUNNER_TEMP/replay.json" || true  # lint-allowed: a failed read is recorded as UNABLE
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          try:
              out = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "replay.json")))
          except Exception:
              out = {}
          result = out.get("result") if out.get("result") in ("REPRODUCED", "DIFFERENT", "UNABLE") else "UNABLE"
          observed = re.sub(r"[^A-Za-z0-9 ,./:()'-]", "", str(out.get("observed") or "no result was written"))[:200]
          print(f"result={result}\nobserved={observed}")
          PY
  record:
    needs: test
    if: always() && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record the replay rescore
        env:
          REPO: ${{ github.event.client_payload.repo }}
          SLUG: ${{ github.event.client_payload.slug }}
          DIGEST: ${{ github.event.client_payload.digest }}
          PEER: ${{ github.event.client_payload.peer }}
          PEER_OWNER: ${{ github.event.client_payload.peer_owner }}
          RESULT: ${{ needs.test.outputs.result }}
          OBSERVED: ${{ needs.test.outputs.observed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ && "$SLUG" =~ ^[a-z0-9][a-z0-9-]{1,60}$ && "$DIGEST" =~ ^[0-9a-f]{16}$ ]] || exit 0
          [[ "$PEER" =~ ^[1-9][0-9]{0,5}$ && "$PEER_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]] || exit 0
          mkdir -p "rescores/${REPO}"
          python3 - <<'PY'
          import json, os, datetime
          result = os.environ["RESULT"] if os.environ["RESULT"] in ("REPRODUCED", "DIFFERENT", "UNABLE") else "UNABLE"
          record = {"v": 1, "kind": "workflow-replay-rescore", "repo": os.environ["REPO"], "workflow": os.environ["SLUG"], "digest": os.environ["DIGEST"],
                    "result": result, "observed": os.environ["OBSERVED"] or ("the run did not finish" if result == "UNABLE" else ""),
                    "peer": os.environ["PEER"], "peer_owner": os.environ["PEER_OWNER"],
                    "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "run": os.environ["RUN"]}
          with open(f"rescores/{record['repo']}/wf-{record['workflow']}-{record['digest']}.json", "w") as out:
              json.dump(record, out, indent=2)
              out.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rescores
          git commit --quiet -m "${REPO} workflow ${SLUG} ${DIGEST}: ${RESULT:-UNABLE} for #${PEER}" || exit 0
          for try in 1 2 3 4 5 6; do
            git push --quiet && exit 0
            sleep $((try * 2))
            git pull --quiet --rebase
          done
          exit 1
