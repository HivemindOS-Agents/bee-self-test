# The answer-or-abstain fixtures (the 15 Nov proposal bundle, Part 2), run in both directions: a wrong CURRENT and a
# needless ABSTAIN both fail. The same fixture bytes are in HivemindOS's shared core, pinned by sha256 in both places.
# No network and no agent code: only the fixture file is read.
name: memory-reads
on:
  push:
    branches: [main]
    paths: ["scripts/check_memory_reads.py", "fixtures/memory-read/**", ".github/workflows/memory-reads.yml"]
  workflow_dispatch:
permissions: {}
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The eight fixtures, both ways
        run: python3 scripts/check_memory_reads.py fixtures/memory-read/fixtures.json
