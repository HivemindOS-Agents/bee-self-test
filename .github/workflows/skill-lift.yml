# Skill lift (HB-036 of the Agent Learning & Self-heal Loop, HB-044): does a shared skill help, against the same agent
# with no skill? scripts/lift_run.py runs each task of lift/<skill>/tasks.json twice on the same explicit model, tools,
# attempts and budget, once with the skill's SKILL.md and once without, and writes a `lift` block. A partial,
# incomplete, unreviewed or stale run keeps its counts and `lift: null`: it is never shown as lift.
#
# On demand only for now (Phase 0: no paid run has been made). The check job needs no secret: the unit tests on canned
# answers, the task set's shape and hashes, and every task's checks re-derived from the chain over a keyless public RPC.
# The run job is the only one that holds the gateway key, as an environment variable of its one step; the model's tools
# get no key (a keyless read-only RPC and a stubbed notify). Model spend is host CI spend, capped by --max-cost-usd,
# never an agent's wallet. The record job runs no model and no tool code, and writes lift/<skill>/runs/ only.
#
# HB-036 "+" (20 Nov 2026): when lift/<skill>/held-out.json exists, the check job picks its tasks again from the chain
# (they must be the ones the block-hash rule gives after the skill's edit) and the run counts them beside the tune set.
# Every run carries a calibration label; without lift/<skill>/calibration.json (the same tasks run once through the real
# agent runtime) it is `proxy-uncalibrated`. A run dispatched with `promotion` fails unless it is a promote test.
name: skill-lift (manual-only)
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "The task set: lift/<skill>/tasks.json"
        required: true
        default: tx-explain
      model:
        description: "The explicit model id for both arms (no default is used)"
        required: true
      prices:
        description: 'The model''s price, JSON: {"<model>": {"inputUsdPerMTok": n, "outputUsdPerMTok": n}}'
        required: true
      max_cost_usd:
        description: "Model spend cap for the whole run, in USD (judge calls excluded)"
        required: true
        default: "1"
      max_judge_calls:
        description: "Judge-call cap (tx-explain has no judge checks)"
        required: true
        default: "0"
      allow_unreviewed:
        description: "Run on a task set whose different-owner review is still pending (its lift stays null)"
        type: boolean
        default: false
      reasoning_effort:
        description: "For a reasoning model: low, medium or high, the same in both arms (blank sends none)"
        default: ""
      promotion:
        description: "This run decides a promotion or a rewrite: fail unless it is a promote test (held-out tasks, no held-out drop, a calibrated proxy)"
        type: boolean
        default: false
      previous_skill_url:
        description: "A rewrite: the pinned raw URL of the skill's previous version, run on the held-out tasks too (blank for a first version)"
        default: ""
permissions: {}
concurrency:
  group: skill-lift
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SKILL: ${{ inputs.skill }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Unit tests on canned answers
        run: python3 -m unittest discover -s tests -p 'test_lift_run.py' -v
      - name: The task set is sound and its checks hold on the chain
        run: |
          set -eu
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || { echo "Not a skill slug."; exit 2; }
          python3 scripts/lift_run.py --check-taskset "lift/$SKILL/tasks.json"
          python3 scripts/lift_run.py --verify-tasks "lift/$SKILL/tasks.json"
      - name: The held-out tasks are the ones the rule picks after the skill's edit (HB-036 +)
        run: |
          set -eu
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || { echo "Not a skill slug."; exit 2; }
          if [ -f "lift/$SKILL/held-out.json" ]; then
            python3 scripts/lift_run.py --verify-held-out "lift/$SKILL/held-out.json" --taskset "lift/$SKILL/tasks.json"
          else
            echo "No held-out tasks for $SKILL: the run will say so, and it is no promote test."
          fi
  run:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SKILL: ${{ inputs.skill }}
      MODEL: ${{ inputs.model }}
      PRICES: ${{ inputs.prices }}
      MAX_COST_USD: ${{ inputs.max_cost_usd }}
      MAX_JUDGE_CALLS: ${{ inputs.max_judge_calls }}
      ALLOW_UNREVIEWED: ${{ inputs.allow_unreviewed }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      PROMOTION: ${{ inputs.promotion }}
      PREVIOUS_SKILL_URL: ${{ inputs.previous_skill_url }}
      ENDPOINT: ${{ vars.LIFT_ENDPOINT }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the inputs and the pinned skill file
        run: |
          set -eu
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || { echo "Not a skill slug."; exit 2; }
          [[ "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]{2,100}$ ]] || { echo "Not a model id."; exit 2; }
          [[ "$MAX_COST_USD" =~ ^[0-9]+(\.[0-9]+)?$ && "$MAX_JUDGE_CALLS" =~ ^[0-9]{1,3}$ ]] || { echo "Not a cap."; exit 2; }
          [[ "$ENDPOINT" =~ ^https:// ]] || { echo "Set the repository variable LIFT_ENDPOINT to the gateway's chat completions URL."; exit 2; }
          printf '%s' "$PRICES" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert isinstance(p, dict) and p' > /dev/null
          printf '%s' "$PRICES" > "$RUNNER_TEMP/prices.json"
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["skillUrl"])' "lift/$SKILL/tasks.json")
          [[ "$URL" =~ ^https://raw\.githubusercontent\.com/ ]] || { echo "The task set's skillUrl is not a pinned raw file."; exit 2; }
          curl -fsS -m 20 "$URL" -o "$RUNNER_TEMP/SKILL.md"
          if [ -n "$PREVIOUS_SKILL_URL" ]; then
            [[ "$PREVIOUS_SKILL_URL" =~ ^https://raw\.githubusercontent\.com/[A-Za-z0-9._/-]+$ ]] || { echo "The previous skill's URL is not a pinned raw file."; exit 2; }
            curl -fsS -m 20 "$PREVIOUS_SKILL_URL" -o "$RUNNER_TEMP/PREVIOUS.md"
          fi
      - name: Both arms, with and without the skill
        env:
          HIVEMINDOS_GATEWAY_KEY: ${{ secrets.HIVEMINDOS_GATEWAY_KEY }}
        run: |
          set -u
          EXTRA=""; [ "$ALLOW_UNREVIEWED" = "true" ] && EXTRA="--allow-unreviewed"
          case "$REASONING_EFFORT" in low|medium|high) EXTRA="$EXTRA --reasoning-effort $REASONING_EFFORT" ;; "") ;; *) echo "Not a reasoning effort."; exit 2 ;; esac
          # HB-036 +: the held-out tasks, the proxy-vs-runtime record and the previous version, when each exists.
          [ -f "lift/$SKILL/held-out.json" ] && EXTRA="$EXTRA --held-out lift/$SKILL/held-out.json"
          [ -f "lift/$SKILL/calibration.json" ] && EXTRA="$EXTRA --calibration lift/$SKILL/calibration.json"
          [ -f "$RUNNER_TEMP/PREVIOUS.md" ] && EXTRA="$EXTRA --previous-skill-file $RUNNER_TEMP/PREVIOUS.md"
          mkdir -p "$RUNNER_TEMP/out"
          python3 scripts/lift_run.py --taskset "lift/$SKILL/tasks.json" --skill-file "$RUNNER_TEMP/SKILL.md" \
            --model "$MODEL" --endpoint "$ENDPOINT" --key-env HIVEMINDOS_GATEWAY_KEY \
            --max-cost-usd "$MAX_COST_USD" --price-file "$RUNNER_TEMP/prices.json" --max-judge-calls "$MAX_JUDGE_CALLS" \
            --report "$RUN_URL" --out "$RUNNER_TEMP/out/run.json" $EXTRA
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: The run's lift block passes the CI checks
        if: always()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/out/run.json" ] || { echo "No run was written."; exit 1; }
          python3 -c 'import json,sys; json.dump(json.load(open(sys.argv[1]))["lift"], open(sys.argv[2], "w"))' "$RUNNER_TEMP/out/run.json" "$RUNNER_TEMP/out/lift.json"
          python3 scripts/lift_run.py --check-lift "$RUNNER_TEMP/out/lift.json" --taskset "lift/$SKILL/tasks.json" --skill-file "$RUNNER_TEMP/SKILL.md"
      - name: A promotion run is a promote test, or this fails (HB-036 +)
        if: always() && inputs.promotion
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/out/run.json" ] || { echo "No run was written."; exit 1; }
          python3 scripts/lift_run.py --check-promotion "$RUNNER_TEMP/out/run.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lift-run
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
  record:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      SKILL: ${{ inputs.skill }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lift-run
          path: ${{ runner.temp }}/out
        continue-on-error: true  # lint-allowed: absent when the run made no file, and the next step says "Nothing to record."
      - name: Record the run under lift/<skill>/runs/
        run: |
          set -eu
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || exit 0
          [ -f "$RUNNER_TEMP/out/run.json" ] || { echo "Nothing to record."; exit 0; }
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["lift"]["state"] in ("complete","partial","incomplete","unreviewed","stale")' "$RUNNER_TEMP/out/run.json"
          mkdir -p "lift/$SKILL/runs"
          cp "$RUNNER_TEMP/out/run.json" "lift/$SKILL/runs/$(date -u +%Y-%m-%dT%H%M%SZ)-${GITHUB_RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "lift/$SKILL/runs"
          git commit -m "skill-lift $SKILL: run ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase --quiet
          git push --quiet
